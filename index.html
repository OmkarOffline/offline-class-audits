<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Audits | Artium Academy</title>
<link rel="stylesheet" href="styles.css?v=20261009b">
</head>
<body>

<main id="page" hidden>
  <section class="card home-hero">
    <div>
      <div class="eyebrow" id="monthLabel"></div>
      <h1 id="hello">Class Audits</h1>
      <div class="muted small" id="scopeLabel"></div>
    </div>
    <a class="btn start-btn" href="audit.html">Start New Audit</a>
  </section>

  <section class="card todo" id="todoCard">
    <div class="todo-head">
      <h2 id="todoTitle">You are yet to audit these teachers this month</h2>
      <span class="muted small" id="todoMeta"></span>
    </div>
    <div class="progress" aria-hidden="true"><span id="todoBar"></span></div>
    <div id="todoList"></div>
  </section>

  <section id="centreCards" class="centre-grid"></section>

  <section class="card">
    <div class="table-head">
      <h2>This month in detail</h2>
      <select id="centreFilter" aria-label="Centre" hidden></select>
    </div>
    <div class="chips" role="tablist" aria-label="Group by">
      <button type="button" role="tab" class="chip on" data-view="course">Course</button>
      <button type="button" role="tab" class="chip" data-view="batch">Batch type</button>
      <button type="button" role="tab" class="chip" data-view="teacher">Teacher</button>
    </div>
    <div class="table-wrap" id="detailTable"></div>
  </section>
</main>

<script src="config.js?v=20261009b"></script>
<script src="common.js?v=20261009b"></script>
<script>
let ctx = null, audits = [], view = "course";
const ANY = "__all";

const now = new Date();
const MONTH_KEY = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
const MONTH_NAME = now.toLocaleDateString("en-IN", { month: "long", year: "numeric" });
const daysLeft = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate() - now.getDate();

const avg = list => { const v = list.map(a => a.scorePct).filter(p => p != null && p !== "").map(Number); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
const pct = p => p == null ? "–" : (Math.round(p * 10) / 10) + "%";
const pill = p => p == null ? "" : `<span class="scorepill ${p >= 80 ? "sp-good" : p >= REFERRAL_RULES.minScorePct ? "sp-mid" : "sp-low"}">${pct(p)}</span>`;
const shortDate = iso => iso ? new Date(iso + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short" }) : "";
const key = t => t.name + "|" + t.centre;

function myCentres() {
  return ctx.auditors.some(a => a.centre === ALL) ? CENTRES.map(c => c.name) : [...new Set(ctx.auditors.map(a => a.centre))];
}
function teachersIn(centres) { return TEACHERS.filter(t => centres.includes(t.centre)); }
function thisMonth(list) { return list.filter(a => (a.date || "").startsWith(MONTH_KEY)); }

/* ---------------- render ---------------- */
function render() {
  const centres = myCentres();
  const teachers = teachersIn(centres);
  const month = thisMonth(audits);
  const first = (ctx.auditors[0] || {}).name || "";

  $("monthLabel").textContent = MONTH_NAME;
  $("hello").textContent = "Hi, " + first.split(" ")[0];
  $("scopeLabel").textContent = centres.length > 1 ? "All centres" : `${centres[0]}, ${centreOf(centres[0]).city}`;

  renderTodo(centres, teachers, month);
  renderCentres(centres, month);
  renderTable();
}

function renderTodo(centres, teachers, month) {
  const done = new Set(month.map(a => a.teacher + "|" + a.centre));
  const lastAudit = {};
  audits.forEach(a => { const k = a.teacher + "|" + a.centre; if (!lastAudit[k] || a.date > lastAudit[k]) lastAudit[k] = a.date; });
  const pending = teachers.filter(t => !done.has(key(t)))
    .sort((a, b) => (lastAudit[key(a)] || "").localeCompare(lastAudit[key(b)] || "") || a.name.localeCompare(b.name));
  const doneCount = teachers.length - pending.length;

  $("todoBar").style.width = teachers.length ? (doneCount / teachers.length * 100) + "%" : "0%";
  $("todoMeta").textContent = `${doneCount} of ${teachers.length} audited · ${daysLeft} day${daysLeft === 1 ? "" : "s"} left in ${now.toLocaleDateString("en-IN", { month: "long" })}`;

  if (!pending.length) {
    $("todoTitle").textContent = "Every teacher has been audited this month";
    $("todoList").innerHTML = `<p class="muted" style="margin:6px 0 0">Nice work. New audits this month will still show in the overview below.</p>`;
    return;
  }
  $("todoTitle").textContent = `You are yet to audit ${pending.length} teacher${pending.length > 1 ? "s" : ""} this month`;
  const groups = centres.map(c => ({ c, list: pending.filter(t => t.centre === c) })).filter(g => g.list.length);
  $("todoList").innerHTML = groups.map(g => `
    ${centres.length > 1 ? `<div class="todo-centre">${esc(g.c)}</div>` : ""}
    <ul class="todo-list">
      ${g.list.map(t => {
        const last = lastAudit[key(t)];
        return `<li>
          <span class="todo-name"><b>${esc(t.name)}</b><small>${esc(t.course)}</small></span>
          <span class="todo-last ${last ? "" : "never"}">${last ? "Last: " + esc(shortDate(last)) : "Never audited"}</span>
        </li>`;
      }).join("")}
    </ul>`).join("");
}

function renderCentres(centres, month) {
  $("centreCards").innerHTML = centres.map(c => {
    const ts = TEACHERS.filter(t => t.centre === c);
    const list = month.filter(a => a.centre === c);
    const covered = new Set(list.map(a => a.teacher)).size;
    const ref = list.filter(a => a.referredToAcademic === "Yes").length;
    const a = avg(list);
    return `<article class="card centre-card">
      <div class="centre-top"><h3>${esc(c)}</h3><span class="muted small">${esc(centreOf(c).city)}</span></div>
      <div class="kpis">
        <div><div class="v">${list.length}</div><div class="k">Audits</div></div>
        <div><div class="v">${covered}<small>/${ts.length}</small></div><div class="k">Teachers audited</div></div>
        <div><div class="v">${a == null ? "–" : pct(a)}</div><div class="k">Average score</div></div>
        <div><div class="v ${ref ? "warn" : ""}">${ref}</div><div class="k">Referred</div></div>
      </div>
      <div class="progress" aria-hidden="true"><span style="width:${ts.length ? covered / ts.length * 100 : 0}%"></span></div>
    </article>`;
  }).join("");
}

function renderTable() {
  const centres = myCentres();
  const f = $("centreFilter").value || ANY;
  const scope = f === ANY ? centres : [f];
  const teachers = teachersIn(scope);
  const month = thisMonth(audits).filter(a => scope.includes(a.centre));
  const multi = scope.length > 1;
  let head, rows;

  if (view === "course") {
    const courses = [...new Set(teachers.map(t => t.course))].sort();
    head = ["Course", "Teachers", "Audited", "Audits", "Average"];
    rows = courses.map(c => {
      const ts = teachers.filter(t => t.course === c);
      const list = month.filter(a => a.course === c);
      const covered = new Set(list.map(a => a.teacher + "|" + a.centre)).size;
      return [esc(c), ts.length, `${covered} / ${ts.length}`, list.length, pill(avg(list)) || "–"];
    });
  } else if (view === "batch") {
    head = ["Batch type", "Audits", "Teachers covered", "Average"];
    rows = BATCH_TYPES.map(b => {
      const list = month.filter(a => a.batchType === b);
      return [esc(b), list.length, new Set(list.map(a => a.teacher + "|" + a.centre)).size, pill(avg(list)) || "–"];
    });
  } else {
    head = ["Teacher", "Course", ...(multi ? ["Centre"] : []), "Audits", "Average", "Latest"];
    rows = teachers.slice().sort((a, b) => a.centre.localeCompare(b.centre) || a.name.localeCompare(b.name)).map(t => {
      const list = month.filter(a => a.teacher === t.name && a.centre === t.centre);
      const latest = list.map(a => a.date).sort().pop();
      return [`<a href="scores.html?teacher=${encodeURIComponent(t.name)}">${esc(t.name)}</a>`, esc(t.course), ...(multi ? [esc(t.centre)] : []),
              list.length || `<span class="muted">0</span>`, pill(avg(list)) || "–", latest ? esc(shortDate(latest)) : `<span class="muted">–</span>`];
    });
  }
  const isNum = i => i > 0 && !["Course", "Centre"].includes(head[i]);
  $("detailTable").innerHTML = `<table class="tbl">
    <thead><tr>${head.map((h, i) => `<th class="${isNum(i) ? "num" : ""}">${h}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${isNum(i) ? "num" : ""}">${c}</td>`).join("")}</tr>`).join("")}</tbody>
  </table>`;
}

/* ---------------- load ---------------- */
async function load() {
  try {
    const out = await new Promise((resolve, reject) =>
      App.ensureFresh(() => App.api("audits", {}).then(resolve, reject)));
    audits = out.audits || [];
    render();
  } catch (e) {
    $("todoList").innerHTML = `<p class="errors">Couldn't load audits: ${esc(e.message)}</p>`;
  }
}

document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
  view = b.dataset.view;
  document.querySelectorAll('[data-view]').forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-selected", x === b); });
  renderTable();
});
$("centreFilter").onchange = renderTable;
// Pick up audits submitted in another tab when the page comes back into view.
document.addEventListener("visibilitychange", () => { if (!document.hidden && ctx) load(); });

App.start("home", c => {
  if (!c.isAuditor) { location.replace("scores.html"); return; }   // teachers only see their own scores
  ctx = c;
  const centres = myCentres();
  $("centreFilter").hidden = centres.length < 2;
  $("centreFilter").innerHTML = `<option value="${ANY}">All centres</option>` + centres.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
  load();
});
</script>
</body>
</html>
