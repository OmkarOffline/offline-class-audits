<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Audits | Artium Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css?v=20261014a">
</head>
<body>

<main id="page" class="wide" hidden>
  <section class="card home-hero">
    <div>
      <div class="eyebrow" id="monthLabel"></div>
      <h1 id="hello">Class Audits</h1>
      <div class="muted small" id="scopeLabel"></div>
    </div>
    <a class="btn start-btn" href="audit.html">Start New Audit</a>
  </section>

  <section class="centres" id="centresSection">
    <div class="sechead"><h2>Centres this month</h2><span id="centresMeta"></span></div>
    <div id="centreCards" class="centre-grid"></div>
  </section>

  <section class="overview" id="overviewSection">
    <div class="sechead"><h2>Audit Overview</h2>
      <span class="sechead-r"><span id="ovMonth"></span>
        <span class="bands-wrap">
          <button type="button" class="bands-btn" id="bandsBtn" aria-expanded="false" aria-controls="bandsPop">ⓘ Score bands</button>
          <div class="bands-pop" id="bandsPop" hidden>
            <div class="bands-title">Score bands</div>
            <ul class="bands-list">
              <li><i class="b-poor"></i>Poor · up to 40%</li>
              <li><i class="b-average"></i>Average · 41–60%</li>
              <li><i class="b-good"></i>Good · 61–90%</li>
              <li><i class="b-excellent"></i>Excellent · 91–100%</li>
              <li><i class="b-done"></i>Audit done</li>
              <li><i class="b-pending"></i>Audit pending</li>
            </ul>
          </div>
        </span>
      </span>
    </div>
    <div class="ov-panel" id="ovPanel">
      <div class="ov-sum">
        <div class="ov-big"><b id="ovLeft">–</b><span id="ovLeftText">Loading audits…</span></div>
        <span class="ov-pace" id="ovPace" hidden></span>
      </div>
      <div class="ov-bar" aria-hidden="true"><i id="ovFill"></i><em id="ovMark"></em></div>
      <div class="ov-barlbl"><span id="ovDone"></span><span class="g" id="ovMarkLbl"></span><span id="ovDays"></span></div>
      <div class="ov-cols" id="ovCols"></div>
    </div>
  </section>

  <section class="card">
    <div class="table-head">
      <h2>This month in detail</h2>
      <select id="centreFilter" aria-label="Centre" hidden></select>
    </div>
    <div class="chips" role="tablist" aria-label="Group by">
      <button type="button" role="tab" class="chip on" data-view="course">Course</button>
      <button type="button" role="tab" class="chip" data-view="batch">Batch type</button>
      <button type="button" role="tab" class="chip" data-view="teacher">Teacher</button>
      <button type="button" role="tab" class="chip" data-view="auditor">Auditor</button>
    </div>
    <div class="table-wrap" id="detailTable"></div>
  </section>
</main>

<script src="config.js?v=20261014a"></script>
<script src="common.js?v=20261014a"></script>
<script>
let ctx = null, audits = [], view = "course";
const TARGET = AUDITS_PER_TEACHER_PER_MONTH;
const ANY = "__all";

const now = new Date();
const MONTH_KEY = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
const MONTH_NAME = now.toLocaleDateString("en-IN", { month: "long", year: "numeric" });
const daysLeft = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate() - now.getDate();

const avg = list => { const v = list.map(a => a.scorePct).filter(p => p != null && p !== "").map(Number); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
const pct = p => p == null ? "–" : (Math.round(p * 10) / 10) + "%";
const pill = p => { const b = scoreBand(p); return b ? `<span class="scorepill sp-${b.key}">${pct(p)}</span>` : ""; };
const shortDate = iso => iso ? new Date(iso + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short" }) : "";
const key = t => t.name + "|" + t.centre;

const isReviewer = () => ctx.allCentres;
function myCentres() {
  return ctx.viewCentres;
}
function teachersIn(centres) { return TEACHERS.filter(t => centres.includes(t.centre)); }
function thisMonth(list) { return list.filter(a => (a.date || "").startsWith(MONTH_KEY)); }

/* ---------------- render ---------------- */
function render() {
  const centres = myCentres();
  const teachers = teachersIn(centres);
  const month = thisMonth(audits);
  const first = (ctx.auditors[0] || ctx.people[0] || {}).name || "";

  $("monthLabel").textContent = MONTH_NAME;
  $("hello").textContent = "Hi, " + first.split(" ")[0];
  $("scopeLabel").textContent = isReviewer() ? (ctx.isAuditor ? "Reviewer · All centres" : "Reviewer (view only) · All centres") : `${centres[0]}, ${centreOf(centres[0]).city}`;

  renderTodo(centres, teachers, month);
  renderCentres(centres, month);
  renderTable();
}

/* Audits each teacher has had this month (by teacher|centre). */
function countsFor(month) {
  const c = {};
  month.forEach(a => { const k = a.teacher + "|" + a.centre; c[k] = (c[k] || 0) + 1; });
  return c;
}
/* Audits that count towards the monthly target: at most TARGET per teacher. */
const towardsTarget = (teachers, counts) => teachers.reduce((s, t) => s + Math.min(counts[key(t)] || 0, TARGET), 0);

const initials = n => n.split(/\s+/).filter(Boolean).map(w => w[0]).join("").slice(0, 2).toUpperCase();

function renderTodo(centres, teachers, month) {
  const counts = countsFor(month);
  const target = teachers.length * TARGET, done = towardsTarget(teachers, counts), left = target - done;
  const teachersLeft = teachers.filter(t => (counts[key(t)] || 0) < TARGET).length;
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const expected = Math.floor(target * now.getDate() / daysInMonth);
  const monthName = now.toLocaleDateString("en-IN", { month: "long" });

  $("ovMonth").textContent = MONTH_NAME;
  $("ovLeft").textContent = left;
  $("ovLeftText").innerHTML = left
    ? `audit${left === 1 ? "" : "s"} left this month across <strong>${teachersLeft} teacher${teachersLeft === 1 ? "" : "s"}</strong>`
    : `audits left. <strong>Every teacher has had ${TARGET} audits this month.</strong>`;
  const pace = $("ovPace");
  pace.hidden = false;
  if (!left) { pace.className = "ov-pace on"; pace.textContent = "Monthly target met"; }
  else if (done >= expected) { pace.className = "ov-pace on"; pace.textContent = "On track"; }
  else { const short = expected - done; pace.className = "ov-pace behind"; pace.textContent = `Behind pace · ${short} audit${short === 1 ? "" : "s"} short`; }
  $("ovFill").style.width = target ? (done / target * 100) + "%" : "0%";
  $("ovMark").style.left = target ? (expected / target * 100) + "%" : "0%";
  $("ovMark").hidden = !left;
  $("ovDone").textContent = `${done} of ${target} done`;
  $("ovMarkLbl").textContent = left ? `▲ ${expected} by today keeps you on track` : "";
  $("ovDays").textContent = `${daysLeft} day${daysLeft === 1 ? "" : "s"} left in ${monthName}`;

  // Each teacher's average this month (one audit's score, or the average of both).
  const scores = {};
  month.forEach(a => { if (a.scorePct == null || a.scorePct === "") return; (scores[a.teacher + "|" + a.centre] = scores[a.teacher + "|" + a.centre] || []).push(Number(a.scorePct)); });
  const avgOf = t => { const v = scores[key(t)]; return v && v.length ? Math.round(v.reduce((s, x) => s + x, 0) / v.length * 10) / 10 : null; };
  // Teachers with at least one flagged audit this month (low score or too many 0 ratings).
  const flaggedKeys = new Set(month.filter(a => a.referredToAcademic === "Yes").map(a => a.teacher + "|" + a.centre));

  $("ovCols").style.setProperty("--cols", Math.min(centres.length, 3));
  $("ovCols").innerHTML = centres.map(c => {
    const ts = teachers.filter(t => t.centre === c).map(t => ({ t, n: counts[key(t)] || 0, a: avgOf(t) }));
    ts.sort((x, y) => (x.a == null) - (y.a == null) || (y.a ?? 0) - (x.a ?? 0) || x.t.name.localeCompare(y.t.name));
    const complete = ts.filter(r => r.n >= TARGET).length;
    return `<div class="ov-col">
      <div class="ov-colhead"><div><div class="ccard-city">${esc(centreOf(c).city)}</div><div class="ov-cname">${esc(c)}</div></div>
        <span class="ov-count">${complete} of ${ts.length} complete</span></div>
      ${ts.map(({ t, n, a }) => {
        const b = scoreBand(a), fl = flaggedKeys.has(key(t));
        return `<a class="ov-row${fl ? " is-flagged" : ""}" href="scores.html?teacher=${encodeURIComponent(t.name)}">
          <span class="ov-av" aria-hidden="true">${esc(initials(t.name))}</span>
          <span class="ov-who"><b><span class="ov-nm">${esc(t.name)}</span>${fl ? `<span class="ov-flag" title="Flagged this month" aria-label="Flagged this month">${FLAG_ICON}</span>` : ""}</b><small>${esc(t.course)}</small></span>
          <span class="ov-dots" title="${n} of ${TARGET} audits done">${Array.from({ length: TARGET }, (_, i) => `<i class="${i < n ? "f" : ""}"></i>`).join("")}</span>
          ${b ? `<span class="ov-score b-${b.key}">${pct(a)}<small>${b.label}</small></span>` : `<span class="ov-score pending">Pending</span>`}
        </a>`;
      }).join("")}
    </div>`;
  }).join("");
}

const FLAG_ICON = '<svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 2h2v20H5zM8 3h11l-2.5 4.5L19 12H8z"/></svg>';
function ringSvg(done, target) {
  const r = 44, c = 2 * Math.PI * r, p = target ? Math.min(done / target, 1) : 0;
  return `<div class="ring" role="img" aria-label="${done} of ${target} audits done">
    <svg width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" class="ring-track"/>
    ${done ? `<circle cx="50" cy="50" r="${r}" class="ring-fill" stroke-dasharray="${(c * p).toFixed(1)} ${c.toFixed(1)}"/>` : ""}</svg>
    <div class="ring-c"><span><span class="ring-n">${done}</span><span class="ring-o">of ${target}</span></span></div>
  </div>`;
}
function renderCentres(centres, month) {
  const counts = countsFor(month);
  const monthName = now.toLocaleDateString("en-IN", { month: "long" });
  $("centresMeta").textContent = `${MONTH_NAME} · target: ${TARGET} audits per teacher`;
  $("centreCards").innerHTML = centres.map(c => {
    const ts = TEACHERS.filter(t => t.centre === c);
    const list = month.filter(a => a.centre === c);
    const target = ts.length * TARGET, done = towardsTarget(ts, counts), left = target - done;
    const both = ts.filter(t => (counts[key(t)] || 0) >= TARGET).length;
    const flagged = new Set(list.filter(a => a.referredToAcademic === "Yes").map(a => a.teacher)).size;
    const a = avg(list);
    const band = scoreBand(a);
    const status = !done ? "Not started yet" : left > 0 ? `${done} done · ${left} to go` : "Monthly target met";
    return `<article class="ccard">
      <div class="ccard-city">${esc(centreOf(c).city)}</div>
      <h3 class="ccard-name">${esc(c)}</h3>
      <div class="ccard-body">
        ${ringSvg(done, target)}
        <div class="ccard-status"><b>${status}</b>
          <span>${both} of ${ts.length} teacher${ts.length === 1 ? " has" : "s have"} had both monthly audits</span></div>
      </div>
      <div class="ccard-metrics">
        <div><div class="mk">Average score</div>
          ${a == null ? `<div class="mv quiet">Not yet</div>` : `<div class="mv">${pct(a)}<span class="tone t-${band.key}">${band.label}</span></div>`}</div>
        <div class="vdiv"></div>
        <div><div class="mk">${FLAG_ICON} Flagged</div>
          ${flagged ? `<div class="mv flagged">${flagged}<span>teacher${flagged > 1 ? "s" : ""}</span></div>` : `<div class="mv quiet">None</div>`}</div>
      </div>
      <div class="ccard-foot"><span>${daysLeft} day${daysLeft === 1 ? "" : "s"} left in ${monthName}</span>
        <a href="scores.html?centre=${encodeURIComponent(c)}">View teachers →</a></div>
    </article>`;
  }).join("");
}

function renderTable() {
  const centres = myCentres();
  const f = $("centreFilter").value || ANY;
  const scope = f === ANY ? centres : [f];
  const teachers = teachersIn(scope);
  const month = thisMonth(audits).filter(a => scope.includes(a.centre));
  const multi = scope.length > 1;
  let head, rows;

  if (view === "course") {
    const courses = [...new Set(teachers.map(t => t.course))].sort();
    head = ["Course", "Teachers", "Audits done", "Average"];
    const counts = countsFor(month);
    rows = courses.map(c => {
      const ts = teachers.filter(t => t.course === c);
      const list = month.filter(a => a.course === c);
      return [esc(c), ts.length, `${towardsTarget(ts, counts)} / ${ts.length * TARGET}`, pill(avg(list)) || "–"];
    });
  } else if (view === "batch") {
    head = ["Batch type", "Audits", "Teachers covered", "Average"];
    rows = BATCH_TYPES.map(b => {
      const list = month.filter(a => a.batchType === b);
      return [esc(b), list.length, new Set(list.map(a => a.teacher + "|" + a.centre)).size, pill(avg(list)) || "–"];
    });
  } else if (view === "auditor") {
    head = ["Auditor", "Centre", "Audits", "Teachers covered", "Average given", "Latest"];
    const people = AUDITORS.filter(a => a.centre === ALL || scope.includes(a.centre));
    rows = people.map(a => {
      const list = month.filter(x => (x.auditor || "").replace(/ \(sample\)$/, "") === a.name);
      const latest = list.map(x => x.date).sort().pop();
      return [esc(a.name), esc(a.centre), list.length || `<span class="muted">0</span>`,
              new Set(list.map(x => x.teacher + "|" + x.centre)).size, pill(avg(list)) || "–",
              latest ? esc(shortDate(latest)) : `<span class="muted">–</span>`];
    }).sort((x, y) => (parseInt(String(y[2])) || 0) - (parseInt(String(x[2])) || 0));
  } else {
    head = ["Teacher", "Course", ...(multi ? ["Centre"] : []), "Audits", "Average", "Latest"];
    rows = teachers.slice().sort((a, b) => a.centre.localeCompare(b.centre) || a.name.localeCompare(b.name)).map(t => {
      const list = month.filter(a => a.teacher === t.name && a.centre === t.centre);
      const latest = list.map(a => a.date).sort().pop();
      return [`<a href="scores.html?teacher=${encodeURIComponent(t.name)}">${esc(t.name)}</a>`, esc(t.course), ...(multi ? [esc(t.centre)] : []),
              `<span class="count c${Math.min(list.length, TARGET)}">${list.length}/${TARGET}</span>`, pill(avg(list)) || "–", latest ? esc(shortDate(latest)) : `<span class="muted">–</span>`];
    });
  }
  const isNum = i => i > 0 && !["Course", "Centre"].includes(head[i]);
  $("detailTable").innerHTML = `<table class="tbl">
    <thead><tr>${head.map((h, i) => `<th class="${isNum(i) ? "num" : ""}">${h}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${isNum(i) ? "num" : ""}">${c}</td>`).join("")}</tr>`).join("")}</tbody>
  </table>`;
}

/* ---------------- load ---------------- */
async function load() {
  try {
    const out = await new Promise((resolve, reject) =>
      App.ensureFresh(() => App.api("audits", {}).then(resolve, reject)));
    audits = out.audits || [];
    render();
  } catch (e) {
    $("ovLeftText").innerHTML = `<span class="errors">Couldn't load audits: ${esc(e.message)}</span>`;
  }
}

document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
  view = b.dataset.view;
  document.querySelectorAll('[data-view]').forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-selected", x === b); });
  renderTable();
});
$("centreFilter").onchange = renderTable;
$("bandsBtn").onclick = e => {
  e.stopPropagation();
  const open = $("bandsPop").hidden;
  $("bandsPop").hidden = !open; $("bandsBtn").setAttribute("aria-expanded", open);
};
document.addEventListener("click", e => { if (!e.target.closest(".bands-wrap")) { $("bandsPop").hidden = true; $("bandsBtn").setAttribute("aria-expanded", false); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") { $("bandsPop").hidden = true; $("bandsBtn").setAttribute("aria-expanded", false); } });
// Pick up audits submitted in another tab when the page comes back into view.
document.addEventListener("visibilitychange", () => { if (!document.hidden && ctx) load(); });

App.start("home", c => {
  if (!c.canView) { location.replace("scores.html"); return; }   // teachers only see their own scores
  ctx = c;
  document.querySelector(".start-btn").hidden = !ctx.isAuditor;      // view-only reviewers can't start audits
  const centres = myCentres();
  // Reviewers see the centre overview first, then the coverage list.
  $("centreFilter").hidden = centres.length < 2;
  $("centreFilter").innerHTML = `<option value="${ANY}">All centres</option>` + centres.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
  load();
});
</script>
</body>
</html>
