<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit Scores | Artium Academy</title>
<link rel="stylesheet" href="styles.css?v=20261014a">
</head>
<body>

<main id="page" hidden>
  <!-- Filters (auditors only) -->
  <div class="card fcard" id="filterCard" hidden>
    <div class="fgroup">
      <div class="feyebrow">Who</div>
      <div class="filters">
        <div id="centreWrap">
          <label class="f" for="centrePick">Centre</label>
          <span class="sel"><select id="centrePick"></select></span>
        </div>
        <div>
          <label class="f" for="teacherPick">Teacher</label>
          <span class="sel"><select id="teacherPick"></select></span>
        </div>
        <div>
          <label class="f" for="batchPick">Batch type</label>
          <span class="sel"><select id="batchPick"></select></span>
        </div>
      </div>
    </div>
    <div class="fgroup">
      <div class="fgroup-head">
        <div class="feyebrow">When</div>
        <div class="pmode" role="radiogroup" aria-label="Choose the period by">
          <input type="radio" name="pmode" id="pmMonth" value="month" checked><label for="pmMonth">By month</label>
          <input type="radio" name="pmode" id="pmRange" value="range"><label for="pmRange">Date range</label>
          <input type="radio" name="pmode" id="pmLife" value="life"><label for="pmLife">Lifetime</label>
        </div>
      </div>
      <div class="period" id="periodMonth">
        <div>
          <label class="f" for="monthPick">Month</label>
          <span class="sel"><select id="monthPick"></select></span>
        </div>
        <div>
          <label class="f" for="yearPick">Year</label>
          <span class="sel"><select id="yearPick"></select></span>
        </div>
      </div>
      <div class="period-life" id="periodLife" hidden>Every audit to date.</div>
      <div class="period" id="periodRange" hidden>
        <div>
          <label class="f" for="fromDate">Start date</label>
          <input type="date" id="fromDate">
        </div>
        <div>
          <label class="f" for="toDate">End date</label>
          <input type="date" id="toDate">
        </div>
      </div>
    </div>
    <div class="fsum">
      <span id="filterSummary"></span>
      <button class="linkbtn" type="button" id="resetFilters" hidden>Reset filters</button>
    </div>
    <div class="banner warn small" id="sampleBar" hidden style="margin:14px 0 0">
      <span id="sampleText"></span>
      <button class="linkbtn" type="button" id="sampleBtn"></button>
    </div>
  </div>

  <div id="content"></div>
</main>

<script src="config.js?v=20261014a"></script>
<script src="common.js?v=20261014a"></script>
<script>
const ANY = "__all";
let ctx = null;
let allAudits = [];          // everything this person may see
let rankBy = "overall";
const ITEM_BY_ID = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const SECTION_SHORT = Object.fromEntries(CHECKLIST.map(s => [s.id, s.title.replace(/ \(.*\)$/, "")]));

const pillClass = p => { const b = scoreBand(p); return b ? "sp-" + b.key : "sp-average"; };
const tagClass = r => ({ "2": "t2", "1": "t1", "0": "t0" }[String(r)] || "tna");
const tagText = r => ({ "2": "2 · Consistently", "1": "1 · Partly", "0": "0 · Not observed" }[String(r)] || "N/A");
const pctText = p => p == null ? "–" : (Math.round(p * 10) / 10) + "%";
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const isNA = r => r === "NA" || r === "N/A" || r === "" || r == null;

/* ---------------- scoring helpers ---------------- */
/** % for one audit: overall, or one section (null when that section was all N/A). */
function auditPct(a, sectionId) {
  if (sectionId === "overall") return a.scorePct == null ? null : Number(a.scorePct);
  let t = 0, m = 0;
  (a.items || []).forEach(it => { if (it.id[0] === sectionId && !isNA(it.rating)) { t += Number(it.rating); m += 2; } });
  return m ? t / m * 100 : null;
}

/**
 * Leaderboard rows. The main score is the plain average of the teacher's audits in the chosen period.
 * For "Lifetime" it is a weighted average instead: the teacher's lifetime average blended with everyone's,
 * as if they had LEADERBOARD.priorAudits extra audits at that level, so one or two great classes can't top the board.
 * Every row also carries the teacher's lifetime count and average (same centre and batch filters, any date).
 */
function leaderboard(teachers, audits, lifeAudits, sectionId, lifetime) {
  const k = LEADERBOARD.priorAudits;
  const C = mean(lifeAudits.map(a => auditPct(a, sectionId)).filter(p => p != null));
  const mine = (list, t) => list.filter(a => a.teacher === t.name && a.centre === t.centre);
  const rows = teachers.map(t => {
    const period = mine(audits, t).slice().sort((a, b) => (a.date + a.batchTime).localeCompare(b.date + b.batchTime))
      .map(a => auditPct(a, sectionId)).filter(p => p != null);
    const life = mine(lifeAudits, t).map(a => auditPct(a, sectionId)).filter(p => p != null);
    const lifeAvg = mean(life), lifeN = life.length;
    const weighted = lifeN ? (lifeN * lifeAvg + k * C) / (lifeN + k) : null;
    const n = lifetime ? lifeN : period.length;
    return { t, n, scores: period, avg: mean(period), lifeN, lifeAvg, main: lifetime ? weighted : (period.length ? mean(period) : null) };
  });
  rows.sort((a, b) => (b.main ?? -1) - (a.main ?? -1) || b.n - a.n || a.t.name.localeCompare(b.t.name));
  return { rows, C };
}

/* ---------------- period ---------------- */
const monthLabel = key => new Date(key + "-01T00:00:00").toLocaleDateString("en-IN", { month: "long", year: "numeric" });

const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const FIRST_YEAR = 2026;
const lastDay = (y, m) => new Date(y, m, 0).getDate();     // m is 1–12

/* Period: "By month" (default: this month), "Date range", or "Lifetime" (every audit). */
let periodMode = "month";
function setMonthDates() {
  const m = +$("monthPick").value, y = +$("yearPick").value, mm = String(m).padStart(2, "0");
  $("fromDate").value = `${y}-${mm}-01`;
  $("toDate").value = `${y}-${mm}-${lastDay(y, m)}`;
}
function setThisMonth() {
  const now = new Date();
  $("monthPick").value = String(now.getMonth() + 1);
  if ([...$("yearPick").options].some(o => +o.value === now.getFullYear())) $("yearPick").value = now.getFullYear();
  setMonthDates();
}
function setupPeriod(saved) {
  const thisYear = new Date().getFullYear();
  const years = []; for (let y = Math.max(thisYear, FIRST_YEAR); y >= FIRST_YEAR; y--) years.push(y);
  $("yearPick").innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join("");
  $("monthPick").innerHTML = MONTHS.map((m, i) => `<option value="${i + 1}">${m}</option>`).join("");
  periodMode = ["month", "range", "life"].includes(saved.mode) ? saved.mode : "month";
  if (periodMode === "month" && saved.month && /^\d+$/.test(saved.month)) {
    $("monthPick").value = saved.month;
    if (saved.year && years.includes(+saved.year)) $("yearPick").value = saved.year;
    setMonthDates();
  } else setThisMonth();
  if (periodMode === "range") { $("fromDate").value = saved.from || ""; $("toDate").value = saved.to || ""; }
  syncPeriodUI();

  $("monthPick").onchange = $("yearPick").onchange = () => { setMonthDates(); syncPeriodUI(); refresh(); };
  $("fromDate").onchange = $("toDate").onchange = () => { syncPeriodUI(); refresh(); };
  $("pmMonth").onchange = () => { periodMode = "month"; setMonthDates(); syncPeriodUI(); refresh(); };
  // Switching to a range keeps the month's dates as a starting point.
  $("pmRange").onchange = () => { periodMode = "range"; syncPeriodUI(); refresh(); };
  $("pmLife").onchange = () => { periodMode = "life"; syncPeriodUI(); refresh(); };
}
function syncPeriodUI() {
  $("pmMonth").checked = periodMode === "month"; $("pmRange").checked = periodMode === "range"; $("pmLife").checked = periodMode === "life";
  $("periodMonth").hidden = periodMode !== "month"; $("periodRange").hidden = periodMode !== "range"; $("periodLife").hidden = periodMode !== "life";
  $("toDate").min = $("fromDate").value || "";
  $("fromDate").max = $("toDate").value || "";
}
const isThisMonth = () => { const n = new Date(); return +$("monthPick").value === n.getMonth() + 1 && +$("yearPick").value === n.getFullYear(); };

/** Returns [from, to, label]; from/to are yyyy-mm-dd or "". */
function periodRange() {
  if (periodMode === "life") return ["", "", "Lifetime"];
  const f = $("fromDate").value, t = $("toDate").value;
  if (periodMode === "month") return [f, t, `${MONTHS[$("monthPick").value - 1]} ${$("yearPick").value}`];
  if (!f && !t) return ["", "", "Lifetime"];
  return [f, t, `${f ? fmtDate(f) : "Start"} to ${t ? fmtDate(t) : "today"}`];
}

/* ---------------- filters ---------------- */
function allowedCentres() {
  return ctx.viewCentres;
}
function opts(list, allLabel) {
  return (allLabel ? `<option value="${ANY}">${esc(allLabel)}</option>` : "") +
    list.map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join("");
}
function teachersIn(centre) {
  const cs = centre === ANY ? allowedCentres() : [centre];
  return TEACHERS.filter(t => cs.includes(t.centre));
}
function fillTeachers() {
  const centre = $("centrePick").value;
  const list = teachersIn(centre);
  const showCentre = centre === ANY;
  $("teacherPick").innerHTML = opts(list.map(t => ({
    value: t.name, label: `${t.name} · ${t.course}${showCentre ? " · " + t.centre : ""}`
  })), "All teachers");
}
function setupFilters() {
  const centres = allowedCentres();
  $("filterCard").hidden = false;
  $("centrePick").innerHTML = opts(centres.map(c => ({ value: c, label: `${c}, ${centreOf(c).city}` })), centres.length > 1 ? "All centres" : "");
  $("centreWrap").hidden = centres.length === 1;
  $("batchPick").innerHTML = opts(BATCH_TYPES.map(b => ({ value: b, label: b })), "All batch types");

  const params = new URLSearchParams(location.search);
  const wanted = params.get("teacher");
  const wantedCentre = params.get("centre");
  const saved = store.get("artium-scores-filters", sessionStorage) || {};
  const wantedT = TEACHERS.find(t => t.name === wanted && centres.includes(t.centre));
  if (wantedT) { $("centrePick").value = wantedT.centre; fillTeachers(); $("teacherPick").value = wantedT.name; }
  else if (wantedCentre && centres.includes(wantedCentre)) { $("centrePick").value = wantedCentre; fillTeachers(); }
  else {
    if (saved.centre && [...$("centrePick").options].some(o => o.value === saved.centre)) $("centrePick").value = saved.centre;
    fillTeachers();
    if (saved.teacher && [...$("teacherPick").options].some(o => o.value === saved.teacher)) $("teacherPick").value = saved.teacher;
    if (saved.batch) $("batchPick").value = saved.batch;
    if (saved.rankBy) rankBy = saved.rankBy;
  }
  setupPeriod(wantedT ? {} : saved);
  $("centrePick").onchange = () => { fillTeachers(); refresh(); };
  $("teacherPick").onchange = refresh;
  $("batchPick").onchange = refresh;
  $("resetFilters").onclick = resetFilters;
}
/** Highlights the filters in use, and writes the one-line summary under them. */
function paintFilters(f) {
  [["centrePick", f.centre !== ANY && !$("centreWrap").hidden], ["teacherPick", f.teacher !== ANY], ["batchPick", f.batch !== ANY],
   ["monthPick", f.mode === "month" && !isThisMonth()], ["yearPick", f.mode === "month" && !isThisMonth()],
   ["fromDate", !!f.from && f.mode === "range"], ["toDate", !!f.to && f.mode === "range"]]
    .forEach(([id, on]) => $(id).classList.toggle("on", on));
  const [from, to, periodLabel] = periodRange();
  const inPeriod = a => (f.batch === ANY || a.batchType === f.batch) && (!from || a.date >= from) && (!to || a.date <= to);
  const t = f.teacher !== ANY ? TEACHERS.find(x => x.name === f.teacher) : null;
  const n = allAudits.filter(a => inPeriod(a) && (t ? a.teacher === t.name && a.centre === t.centre : (f.centre === ANY || a.centre === f.centre))).length;
  const scope = t ? t.name : f.centre === ANY ? (allowedCentres().length > 1 ? "All centres" : allowedCentres()[0]) : f.centre;
  $("filterSummary").innerHTML = `Showing <b>${n} audit${n === 1 ? "" : "s"}</b> · ${esc(scope)}` +
    (f.batch !== ANY ? ` · ${esc(f.batch)} batches` : "") + ` · ${esc(periodLabel || "Lifetime")}`;
  $("resetFilters").hidden = !(f.teacher !== ANY || f.batch !== ANY || f.mode !== "month" || !isThisMonth() || (f.centre !== ANY && allowedCentres().length > 1));
}
function resetFilters() {
  if (allowedCentres().length > 1) $("centrePick").value = ANY;
  fillTeachers(); $("teacherPick").value = ANY; $("batchPick").value = ANY;
  periodMode = "month"; setThisMonth();
  syncPeriodUI(); refresh();
}
function filters() {
  return { centre: $("centrePick").value, teacher: $("teacherPick").value, batch: $("batchPick").value,
           mode: periodMode, month: $("monthPick").value, year: $("yearPick").value,
           from: periodMode === "life" ? "" : $("fromDate").value, to: periodMode === "life" ? "" : $("toDate").value };
}

/* ---------------- load ---------------- */
async function load() {
  $("content").innerHTML = `<div class="card empty">Loading audits…</div>`;
  try {
    const out = await new Promise((resolve, reject) =>
      App.ensureFresh(() => App.api("audits", {}).then(resolve, reject)));
    allAudits = out.audits || [];
    refresh();
  } catch (e) {
    $("content").innerHTML = `<div class="card empty">Couldn't load audits: ${esc(e.message)}</div>`;
  }
}

function refresh() {
  if (!ctx.canView) { renderTeacher(ctx.teacher, allAudits); return; }
  const f = filters();
  store.set("artium-scores-filters", { ...f, rankBy }, sessionStorage);
  paintFilters(f);
  updateSampleBar();
  const [from, to, periodLabel] = periodRange();
  const keep = a => (f.batch === ANY || a.batchType === f.batch) && (!from || a.date >= from) && (!to || a.date <= to);
  const note = [f.batch === ANY ? "" : `${f.batch} batches`, periodLabel].filter(Boolean).join(" · ");
  if (f.teacher !== ANY) {
    const t = TEACHERS.find(x => x.name === f.teacher);
    renderTeacher(t, allAudits.filter(a => a.teacher === t.name && a.centre === t.centre && keep(a)), note);
  } else {
    const teachers = teachersIn(f.centre);
    const inScope = a => (f.centre === ANY || a.centre === f.centre) && (f.batch === ANY || a.batchType === f.batch);
    const audits = allAudits.filter(a => inScope(a) && keep(a));
    renderGroup(teachers, audits, f, note, allAudits.filter(inScope));
  }
}

function updateSampleBar() {
  if (!App.previewData) return;
  const hasSample = allAudits.some(a => a.sample);
  $("sampleBar").hidden = false;
  $("sampleText").textContent = hasSample
    ? "Showing sample audits so you can see the leaderboards. They're made up and stored only in this browser."
    : allAudits.length ? "" : "No audits yet. Load sample audits to see how the leaderboards look.";
  $("sampleBtn").textContent = hasSample ? "Remove sample audits" : "Load sample audits";
  $("sampleBar").hidden = !hasSample && allAudits.length > 0;
}

/* ---------------- group view: leaderboards ---------------- */
function renderGroup(teachers, audits, f, note, lifeAudits) {
  const scope = f.centre === ANY ? "All centres" : `${f.centre}, ${centreOf(f.centre).city}`;
  const batchNote = note ? " · " + note : "";
  const audited = new Set(audits.map(a => a.teacher + "|" + a.centre));
  const avg = mean(audits.map(a => a.scorePct).filter(p => p != null).map(Number));
  const referred = audits.filter(a => a.referredToAcademic === "Yes").length;
  const showCentre = f.centre === ANY;

  const lifetime = f.mode === "life";
  const { rows, C } = leaderboard(teachers, audits, lifeAudits, rankBy, lifetime);
  const periodName = lifetime ? "Lifetime" : f.mode === "month" ? (isThisMonth() ? "This month" : `${MONTHS[f.month - 1]} ${f.year}`) : "Selected dates";
  const ranked = rows.filter(r => r.n), unaudited = rows.filter(r => !r.n);
  const chips = [["overall", "Overall"], ...CHECKLIST.map(s => [s.id, `${s.id}. ${SECTION_SHORT[s.id]}`])];

  $("content").innerHTML = `
    <div class="card">
      <h1>${esc(scope)}</h1>
      <div class="muted small">All teachers${esc(batchNote)}</div>
      <div class="stats" style="margin:14px 0 0">
        <div class="stat"><div class="v">${audits.length}</div><div class="k">Audits</div></div>
        <div class="stat"><div class="v">${audited.size} / ${teachers.length}</div><div class="k">Teachers audited</div></div>
        <div class="stat"><div class="v">${pctText(avg)}</div><div class="k">Average score</div></div>
        <div class="stat"><div class="v">${referred}</div><div class="k">Flagged</div></div>
      </div>
    </div>

    <div class="card lbcard">
      <div class="lb-top">
        <div>
          <div class="feyebrow">Leaderboard</div>
          <h2 class="lb-title">${rankBy === "overall" ? "Overall" : esc(SECTION_SHORT[rankBy])}<span class="lb-period"> · ${esc(periodName)}</span></h2>
        </div>
        <div class="bands-wrap">
          <button type="button" class="bands-btn" id="lbInfoBtn" aria-expanded="false" aria-controls="lbInfoPop">ⓘ How ranking works</button>
          <div class="bands-pop lb-pop" id="lbInfoPop" hidden>
            <div class="bands-title">How ranking works</div>
            <p><b>By month or date range:</b> teachers are ranked by the average of their audits in that period. The dots show each audit's score, and hollow dots are audits still to do this month.</p>
            <p><b>Lifetime:</b> teachers are ranked by a weighted score. Their lifetime average is blended with the group average (${pctText(C)}) as if they had ${LEADERBOARD.priorAudits} more audits at that level, so one or two great classes can't top the board.</p>
            <p class="lb-pop-few">Under each name: lifetime audits and lifetime average.</p>
          </div>
        </div>
      </div>
      <div class="chips lb-chips" role="tablist" aria-label="Rank by">
        ${chips.map(([id, label]) => `<button type="button" role="tab" class="chip ${id === rankBy ? "on" : ""}" aria-selected="${id === rankBy}" data-rank="${id}">${esc(label)}</button>`).join("")}
      </div>
      ${ranked.length ? podium(ranked.slice(0, 3), showCentre, f.mode) + (ranked.length > 3 ? `
      <div class="lb" role="table">
        ${ranked.slice(3).map((r, i) => lbRow(r, i + 4, showCentre, f.mode)).join("")}
      </div>` : "") : `<div class="empty">No audits match these filters yet.</div>`}
      ${unaudited.length ? `<div class="lb-wait"><span class="lb-wait-k">${lifetime ? "Not audited yet" : "No audits " + (f.mode === "month" ? (isThisMonth() ? "this month" : "in " + esc(periodName)) : "in these dates")}</span>
        <span class="lb-wait-list">${unaudited.map(r => `<span class="lb-wait-p"><i>${esc(initialsOf(r.t.name))}</i>${esc(r.t.name)}</span>`).join("")}</span></div>` : ""}
    </div>
    ${monthTable(audits)}`;

  $("content").querySelectorAll(".chip").forEach(b => b.onclick = () => { rankBy = b.dataset.rank; refresh(); });
  const on = $("content").querySelector(".chip.on");
  if (on) on.parentNode.scrollLeft = on.offsetLeft - on.parentNode.offsetLeft - 24;
  $("lbInfoBtn").onclick = e => {
    e.stopPropagation();
    const open = $("lbInfoPop").hidden;
    $("lbInfoPop").hidden = !open; $("lbInfoBtn").setAttribute("aria-expanded", open);
  };
  $("content").querySelectorAll("[data-teacher]").forEach(b => b.onclick = () => {
    const t = TEACHERS.find(x => x.name === b.dataset.teacher);
    if ($("centrePick").value !== ANY) $("centrePick").value = t.centre;
    $("teacherPick").value = t.name;
    refresh(); window.scrollTo(0, 0);
  });
}

const initialsOf = n => n.split(/\s+/).filter(Boolean).map(w => w[0]).join("").slice(0, 2).toUpperCase();
/** Audit dots: filled with the score for each audit done; hollow for audits still due this month. */
function auditDots(r, mode) {
  if (mode === "life") return "";
  const due = mode === "month" ? Math.max(0, AUDITS_PER_TEACHER_PER_MONTH - r.scores.length) : 0;
  return `<span class="adots">${r.scores.map(p => { const b = scoreBand(p); return `<span class="adot"><i class="f"></i><span class="sc-${b ? b.key : "na"}">${Math.round(p)}%</span></span>`; }).join("")}${
    Array.from({ length: due }, () => `<span class="adot" title="Audit still to do"><i></i></span>`).join("")}</span>`;
}
const lifeLine = r => `Lifetime audits: ${r.lifeN} · Avg ${pctText(r.lifeAvg)}`;

/** Top three on a podium: 2nd · 1st · 3rd, with the leader raised in the middle. */
function podium(top, showCentre, mode) {
  const medals = ["gold", "silver", "bronze"];
  const order = top.length === 3 ? [1, 0, 2] : top.length === 2 ? [1, 0] : [0];
  return `<div class="podium podium-${top.length}">` + order.map(i => {
    const r = top[i], b = scoreBand(r.main);
    return `<button type="button" class="pod pod-${medals[i]}" data-teacher="${esc(r.t.name)}">
      ${i === 0 ? `<span class="pod-crown" aria-hidden="true"><svg viewBox="0 0 24 16" width="26" height="17"><path fill="currentColor" d="M2 14 0 3l6 4 6-7 6 7 6-4-2 11z"/></svg></span>` : ""}
      <span class="pod-av"><span>${esc(initialsOf(r.t.name))}</span><em>${i + 1}</em></span>
      <b class="pod-name">${esc(r.t.name)}</b>
      <small class="pod-sub">${esc(r.t.course)}${showCentre ? " · " + esc(r.t.centre) : ""}</small>
      <span class="pod-score sc-${b ? b.key : "na"}">${pctText(r.main)}</span>
      ${mode === "life" ? `<span class="pod-kind">weighted score</span>` : auditDots(r, mode)}
      <span class="pod-meta">${lifeLine(r)}</span>
      <span class="pod-step">${i + 1}</span>
    </button>`;
  }).join("") + `</div>`;
}

function lbRow(r, rank, showCentre, mode) {
  const b = scoreBand(r.main);
  return `<button type="button" class="lb-row" role="row" data-teacher="${esc(r.t.name)}">
    <span class="rank">${rank}</span>
    <span class="lb-av">${esc(initialsOf(r.t.name))}</span>
    <span class="who-cell"><b>${esc(r.t.name)}</b><small>${esc(r.t.course)}${showCentre ? " · " + esc(r.t.centre) : ""}</small><small class="lb-life">${lifeLine(r)}</small></span>
    <span class="lb-dots">${auditDots(r, mode)}</span>
    <span class="lb-score sc-${b ? b.key : "na"}">${pctText(r.main)}</span>
  </button>`;
}

/* ---------------- month by month ---------------- */
function monthTable(audits) {
  const by = {};
  audits.forEach(a => { const k = (a.date || "").slice(0, 7); if (k) (by[k] = by[k] || []).push(a); });
  const keys = Object.keys(by).sort().reverse();
  if (keys.length < 2) return "";
  return `
    <div class="card">
      <h2>Month by month</h2>
      <div class="months" role="table">
        <div class="mrow mhead" role="row"><span role="columnheader">Month</span><span role="columnheader" class="num">Audits</span><span role="columnheader" class="num">Average</span><span role="columnheader"></span></div>
        ${keys.map(k => {
          const list = by[k];
          const avg = mean(list.map(a => a.scorePct).filter(p => p != null).map(Number));
          const ref = list.filter(a => a.referredToAcademic === "Yes").length;
          return `<div class="mrow" role="row">
            <span>${esc(monthLabel(k))}${ctx.canView && ref ? `<small class="few" style="display:inline;margin-left:6px">${ref} flagged</small>` : ""}</span>
            <span class="num">${list.length}</span>
            <span class="num"><span class="scorepill ${pillClass(avg)}">${pctText(avg)}</span></span>
            <span class="track"><span class="fill" style="display:block;width:${avg || 0}%"></span></span>
          </div>`;
        }).join("")}
      </div>
    </div>`;
}

/* ---------------- teacher view ---------------- */
function sectionAverages(audits) {
  return CHECKLIST.map(sec => {
    const p = mean(audits.map(a => auditPct(a, sec.id)).filter(x => x != null));
    return { sec, pct: p == null ? null : Math.round(p) };
  });
}

function renderTeacher(teacher, audits, note = "") {
  const c = centreOf(teacher.centre);
  const self = !ctx.canView;
  audits = [...audits].sort((a, b) => (b.date + b.batchTime).localeCompare(a.date + a.batchTime));
  const scored = audits.filter(a => a.scorePct != null);
  const avg = mean(scored.map(a => Number(a.scorePct)));
  const latest = scored[0], prev = scored[1];
  const change = latest && prev ? Math.round((latest.scorePct - prev.scorePct) * 10) / 10 : null;
  const batchNote = note ? " · " + note : "";

  let html = `
    <div class="card">
      <h1>${self ? "Your audit scores" : esc(teacher.name)}</h1>
      <div class="muted small">${self ? esc(teacher.name) + " · " : ""}${esc(teacher.course)} · ${esc(teacher.centre)}, ${esc(c ? c.city : "")}${esc(batchNote)}</div>
      <div class="stats" style="margin:14px 0 0">
        <div class="stat"><div class="v">${audits.length}</div><div class="k">Audits</div></div>
        <div class="stat"><div class="v">${latest ? pctText(latest.scorePct) : "–"}</div><div class="k">Latest score</div></div>
        <div class="stat"><div class="v">${pctText(avg)}</div><div class="k">Average score</div></div>
        <div class="stat"><div class="v">${change == null ? "–" : (change > 0 ? "+" : "") + change}</div><div class="k">Change vs previous (pts)</div></div>
      </div>
    </div>`;

  if (!audits.length) {
    html += `<div class="card empty">${self ? "You don't have any audits yet." : "No audits for this teacher" + (note ? " for these filters." : " yet.")}</div>`;
    $("content").innerHTML = html;
    return;
  }

  html += `
    <div class="card">
      <h2>By section</h2>
      <div class="muted small" style="margin:-8px 0 12px">Average across ${audits.length} audit${audits.length > 1 ? "s" : ""}</div>
      <div class="bars">
        ${sectionAverages(audits).map(({ sec, pct }) => `
          <div class="barrow">
            <span>${esc(sec.id)}. ${esc(SECTION_SHORT[sec.id])}</span>
            <div class="track"><div class="fill" style="width:${pct || 0}%"></div></div>
            <span class="val">${pct == null ? "N/A" : pct + "%"}</span>
          </div>`).join("")}
      </div>
    </div>

    ${monthTable(audits)}

    <div class="card">
      <h2>Audit history</h2>
      ${audits.map((a, i) => renderAudit(a, i === 0)).join("")}
    </div>`;
  $("content").innerHTML = html;
}

function renderAudit(a, open) {
  const bySec = CHECKLIST.map(sec => {
    const items = (a.items || []).filter(it => it.id[0] === sec.id);
    if (!items.length) return "";
    return `<div class="sec-title">${esc(sec.id)}. ${esc(sec.title)}</div>` + items.map(it => `
      <div class="ir">
        <span class="id">${esc(it.id)}</span>
        <span>${esc((ITEM_BY_ID[it.id] || {}).p || it.parameter || "")}</span>
        <span class="tag ${tagClass(it.rating)}">${tagText(it.rating)}</span>
        ${it.evidence ? `<span class="ev">${esc(it.evidence)}</span>` : ""}
      </div>`).join("");
  }).join("");

  const referral = ctx.canView && a.referredToAcademic === "Yes"
    ? `<div class="note referred"><b>Flagged to academics and teacher training</b>${
        esc([a.autoReferralReason && "Automatic: " + a.autoReferralReason, a.auditorReferral === "Yes" && "Auditor: " + a.auditorReferralReason].filter(Boolean).join(" · "))}</div>`
    : "";

  return `
    <details class="audit" ${open ? "open" : ""}>
      <summary>
        <div>
          <div><b>${esc(fmtDate(a.date))}</b> · ${esc(a.batchTime || "")}</div>
          <div class="meta">${esc(a.classType || "")} class · ${esc(a.batchType || "")} · audited by ${esc(a.auditor || "")}</div>
        </div>
        <span class="scorepill ${pillClass(a.scorePct)}">${pctText(a.scorePct)}</span>
      </summary>
      <div class="body">
        <div class="meta">${esc(a.totalScore)} / ${esc(a.maxPossible)} points · ${esc(a.learnersPresent)} learner${a.learnersPresent == 1 ? "" : "s"} present</div>
        ${referral}
        <div class="note"><b>Top strength</b>${esc(a.topStrength)}</div>
        <div class="note"><b>Top area to improve</b>${esc(a.topImprove)}</div>
        ${bySec}
      </div>
    </details>`;
}

document.addEventListener("click", e => { const p = $("lbInfoPop"); if (p && !e.target.closest(".bands-wrap")) { p.hidden = true; $("lbInfoBtn").setAttribute("aria-expanded", false); } });
document.addEventListener("keydown", e => { const p = $("lbInfoPop"); if (p && e.key === "Escape") { p.hidden = true; $("lbInfoBtn").setAttribute("aria-expanded", false); } });

$("sampleBtn").onclick = () => {
  allAudits.some(a => a.sample) ? App.clearPreview() : App.seedPreview();
  load();
};

App.start("scores", c => {
  ctx = c;
  $("filterCard").hidden = true;
  if (ctx.canView) setupFilters();
  load();
});
</script>
</body>
</html>
